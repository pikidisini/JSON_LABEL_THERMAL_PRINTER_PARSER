    <sodipodi:guide
       position="103.04011,25.852183"
       orientation="1,0"
       id="guide45"
       inkscape:locked="false" />
  </sodipodi:namedview>
  <!-- Kanvas Utama (Background Putih Absolut & Border presisi) -->
  <rect
